<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>野菜API 桌面助手 · UX 审计</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var requested = q.get("theme");
          var valid =
            requested === "light" ||
            requested === "dark" ||
            requested === "system";
          // The app resolves appearance from localStorage into
          // `documentElement.dataset.theme`; a `dark` class does nothing here.
          // Persist the query choice so React reads the same value on mount.
          if (valid) localStorage.setItem("yeschoy-appearance", requested);
          var t = valid
            ? requested
            : localStorage.getItem("yeschoy-appearance") ||
              localStorage.getItem("cc-switch-theme") ||
              "system";
          var d =
            t === "dark" ||
            (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = d ? "dark" : "light";
          document.documentElement.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import "./mockIpc.ts";
      import "../main.tsx";
    </script>
  </body>
</html>
