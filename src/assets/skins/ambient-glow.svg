<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" aria-hidden="true">
  <!-- TSUKIHANA stage bloom — iris/sakura orbs and a soft floor, not slashes -->
  <defs>
    <radialGradient id="th-amb-sakura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7eb3" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="th-amb-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d5cff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="th-amb-aqua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee8f4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7ee8f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="th-amb-floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="620" cy="240" rx="260" ry="300" fill="url(#th-amb-iris)"/>
  <ellipse cx="540" cy="360" rx="220" ry="200" fill="url(#th-amb-sakura)"/>
  <ellipse cx="700" cy="140" rx="140" ry="120" fill="url(#th-amb-aqua)"/>
  <ellipse cx="610" cy="680" rx="280" ry="70" fill="url(#th-amb-floor)"/>
</svg>
