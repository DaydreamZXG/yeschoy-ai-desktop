<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" aria-hidden="true">
  <!-- Qingmang workbench caustics — lime/gold light, not an orange HUD ring -->
  <defs>
    <radialGradient id="qm-amb" cx="64%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#c9fa10" stop-opacity="0.28"/>
      <stop offset="42%" stop-color="#e7f6a8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9fa10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qm-amb-gold" cx="78%" cy="58%" r="34%">
      <stop offset="0%" stop-color="#d4b36a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4b36a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qm-amb-arc" x1="0" y1="0" x2="1" y2="1">
