  <path d="M 240 260 C 400 200, 580 300, 690 360" fill="none" stroke="#c9fa10" stroke-opacity="0.12" stroke-width="1"/>
  <ellipse cx="540" cy="250" rx="150" ry="110" fill="none" stroke="#c9fa10" stroke-opacity="0.1" stroke-width="1"/>
  <ellipse cx="540" cy="250" rx="210" ry="150" fill="none" stroke="#1c6b4a" stroke-opacity="0.06" stroke-width="1"/>
