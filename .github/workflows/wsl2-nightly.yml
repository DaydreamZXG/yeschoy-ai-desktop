name: YesChoy Nightly

# Keep the existing nightly entrypoint, but validate the active client rather
# than inactive CC Switch WSL configuration writes. This is not WSL coverage.
on:
  schedule:
    - cron: "23 18 * * *" # 02:23 Beijing time; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Current candidate checks
    uses: ./.github/workflows/ci.yml
