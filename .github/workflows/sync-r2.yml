name: Promote Yeschoy Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate version, without v prefix
        required: true
        type: string
      candidate_run_id:
        description: Successful Yeschoy Signed Update Candidate workflow run ID
        required: true
        type: string
      release_notes:
        description: Public release notes, 1 to 600 characters
        required: true
        type: string
      confirmation:
        description: Type PUBLISH followed by the exact version
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: yeschoy-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote signed candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: yeschoy-production
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      DOWNLOAD_ORIGIN_HOST: 43.134.77.210
      DOWNLOAD_ORIGIN_USER: ${{ secrets.DOWNLOAD_ORIGIN_USER }}
    steps:
      - name: Check out exact promotion source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require explicit production intent and exact source identity
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'DaydreamZXG/yeschoy-ai-desktop'
          test "$CONFIRMATION" = "PUBLISH $RELEASE_VERSION"
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DOWNLOAD_ORIGIN_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          node - <<'NODE'
          const fs = require('fs');
          const requested = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync('package.json')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version;
          const cargoVersion = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (![packageVersion, tauriVersion, cargoVersion].every((value) => value === requested)) {
            throw new Error(`version mismatch: request=${requested} package=${packageVersion} tauri=${tauriVersion} cargo=${cargoVersion}`);
          }
          NODE

      - name: Verify candidate run belongs to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('candidate-run.json', encoding='utf-8'))
          expected = {
              'name': 'Yeschoy Signed Update Candidate',
              'event': 'workflow_dispatch',
              'conclusion': 'success',
              'head_sha': os.environ['GITHUB_SHA'],
              'head_repository': os.environ['GITHUB_REPOSITORY'],
          }
          actual = {
              'name': run.get('name'),
              'event': run.get('event'),
              'conclusion': run.get('conclusion'),
              'head_sha': run.get('head_sha'),
              'head_repository': (run.get('head_repository') or {}).get('full_name'),
          }
          if actual != expected:
              raise SystemExit(f'candidate run identity mismatch: {actual!r}')
          PY

      - name: Download both private candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: yeschoy-${{ inputs.version }}-*-update-candidate
          merge-multiple: true
          path: candidate

      - name: Verify exact files and SHA-256 receipts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          root = Path('candidate')
          assets = {
              f'yeschoy-{version}-macos-universal-installer.dmg',
              f'yeschoy-{version}-macos-universal.app.tar.gz',
              f'yeschoy-{version}-macos-universal.app.tar.gz.sig',
              f'yeschoy-{version}-windows-x86_64-installer.exe',
              f'yeschoy-{version}-windows-x86_64.nsis.zip',
              f'yeschoy-{version}-windows-x86_64.nsis.zip.sig',
          }
          receipts = {'SHA256SUMS-macos.txt', 'SHA256SUMS-windows.txt'}
          found = {path.name for path in root.iterdir() if path.is_file() and not path.is_symlink()}
          if found != assets | receipts:
              raise SystemExit(f'candidate file set mismatch: {sorted(found)}')
          for receipt_name in receipts:
              lines = (root / receipt_name).read_text(encoding='utf-8-sig').splitlines()
              covered = set()
              for line in lines:
                  digest, name = line.split(None, 1)
                  name = name.lstrip('*')
                  if name not in assets or name in covered or len(digest) != 64:
                      raise SystemExit(f'invalid checksum entry in {receipt_name}: {line!r}')
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  if actual != digest.lower():
                      raise SystemExit(f'checksum mismatch for {name}')
                  covered.add(name)
              expected = {name for name in assets if ('macos' in name) == ('macos' in receipt_name)}
              if covered != expected:
                  raise SystemExit(f'incomplete checksum coverage in {receipt_name}')
          PY

      - name: Verify both updater signatures with the embedded public key
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          fs.writeFileSync('updater.pub', Buffer.from(config.plugins.updater.pubkey, 'base64'));
          NODE
          for artifact in \
            "candidate/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz" \
            "candidate/yeschoy-$RELEASE_VERSION-windows-x86_64.nsis.zip"
          do
            base64 --decode "$artifact.sig" > "$artifact.minisig"
            minisign -Vm "$artifact" -x "$artifact.minisig" -p updater.pub
          done

      - name: Prepare release notes and locked SSH trust
        env:
          DOWNLOAD_ORIGIN_SSH_KEY: ${{ secrets.DOWNLOAD_ORIGIN_SSH_KEY }}
          DOWNLOAD_ORIGIN_HOST_KEY: ${{ secrets.DOWNLOAD_ORIGIN_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOWNLOAD_ORIGIN_SSH_KEY"
          test -n "$DOWNLOAD_ORIGIN_HOST_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DOWNLOAD_ORIGIN_SSH_KEY" > "$HOME/.ssh/yeschoy_release"
          chmod 600 "$HOME/.ssh/yeschoy_release"
          printf '%s\n' "$DOWNLOAD_ORIGIN_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          python3 - <<'PY'
          import os
          notes = os.environ['RELEASE_NOTES']
          if not 1 <= len(notes.strip()) <= 600:
              raise SystemExit('release notes must contain 1 to 600 characters')
          open('release-notes.txt', 'w', encoding='utf-8').write(notes.strip() + '\n')
          PY

      - name: Stage only the verified candidate files
        id: stage
        run: |
          set -euo pipefail
          remote_stage="/opt/yeschoy-download/incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/yeschoy_release" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DOWNLOAD_ORIGIN_USER@$DOWNLOAD_ORIGIN_HOST" \
            "install -d -m 700 '$remote_stage'"
          scp -i "$HOME/.ssh/yeschoy_release" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            deploy/self-update/publish.py release-notes.txt candidate/* \
            "$DOWNLOAD_ORIGIN_USER@$DOWNLOAD_ORIGIN_HOST:$remote_stage/"
          echo "remote_stage=$remote_stage" >> "$GITHUB_OUTPUT"

      - name: Atomically publish manifests after immutable assets
        id: publish
        env:
          REMOTE_STAGE: ${{ steps.stage.outputs.remote_stage }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/yeschoy_release" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DOWNLOAD_ORIGIN_USER@$DOWNLOAD_ORIGIN_HOST" \
            "/usr/bin/flock --exclusive /opt/yeschoy-download/publish.lock /usr/bin/python3 '$REMOTE_STAGE/publish.py' publish \
              --root /srv/yeschoy-download/public \
              --version '$RELEASE_VERSION' \
              --notes '$REMOTE_STAGE/release-notes.txt' \
              --platform darwin-aarch64='$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz,$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz.sig' \
              --platform darwin-x86_64='$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz,$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz.sig' \
              --platform windows-x86_64='$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-windows-x86_64.nsis.zip,$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-windows-x86_64.nsis.zip.sig' \
              --installer macos-universal='$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-macos-universal-installer.dmg' \
              --installer windows-x86_64='$REMOTE_STAGE/yeschoy-$RELEASE_VERSION-windows-x86_64-installer.exe'" \
            | tee promotion-receipt.json
          python3 - <<'PY'
          import json, os
          receipt = json.load(open('promotion-receipt.json', encoding='utf-8'))
          if receipt.get('status') != 'published' or receipt.get('version') != os.environ['RELEASE_VERSION']:
              raise SystemExit(f'invalid publication receipt: {receipt!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, field in (
                  ('manifest_sha256', 'manifestSha256'),
                  ('previous_manifest_sha256', 'previousManifestSha256'),
                  ('download_manifest_sha256', 'downloadManifestSha256'),
                  ('previous_download_manifest_sha256', 'previousDownloadManifestSha256'),
              ):
                  output.write(f"{key}={receipt.get(field) or 'none'}\n")
          PY

      - name: Verify the public TLS endpoint and both manifests
        id: probe
        run: python3 deploy/self-update/probe_public_release.py --expect-updates published

      - name: Roll back only this exact failed promotion
        if: failure() && steps.publish.outcome == 'success' && steps.probe.outcome == 'failure'
        env:
          REMOTE_STAGE: ${{ steps.stage.outputs.remote_stage }}
          EXPECTED_MANIFEST: ${{ steps.publish.outputs.manifest_sha256 }}
          RESTORE_MANIFEST: ${{ steps.publish.outputs.previous_manifest_sha256 }}
          EXPECTED_DOWNLOAD_MANIFEST: ${{ steps.publish.outputs.download_manifest_sha256 }}
          RESTORE_DOWNLOAD_MANIFEST: ${{ steps.publish.outputs.previous_download_manifest_sha256 }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/yeschoy_release" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DOWNLOAD_ORIGIN_USER@$DOWNLOAD_ORIGIN_HOST" \
            "/usr/bin/flock --exclusive /opt/yeschoy-download/publish.lock /usr/bin/python3 '$REMOTE_STAGE/publish.py' rollback \
              --root /srv/yeschoy-download/public \
              --expected-sha256 '$EXPECTED_MANIFEST' \
              --restore-sha256 '$RESTORE_MANIFEST' \
              --expected-download-sha256 '$EXPECTED_DOWNLOAD_MANIFEST' \
              --restore-download-sha256 '$RESTORE_DOWNLOAD_MANIFEST'"

      - name: Preserve the non-secret publication receipt
        if: always() && hashFiles('promotion-receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yeschoy-${{ inputs.version }}-promotion-receipt
          path: promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
