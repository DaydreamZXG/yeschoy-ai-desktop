name: Yeschoy Windows Internal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeschoy-windows-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 internal installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"

      - name: Cache native build dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-yeschoy-internal-v2-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack install
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify renderer types
        run: pnpm typecheck

      - name: Verify renderer
        run: pnpm test:unit

      - name: Verify native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned internal NSIS installer
        run: pnpm exec tauri build --config src-tauri/tauri.candidate.conf.json --bundles nsis

      - name: Prepare exact internal artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No NSIS installer was produced.'
          }

          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          $fileName = "野菜API-$version-Windows-x64-内测版.exe"
          $destination = "release-assets/$fileName"
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          "$sha256  $fileName" |
            Set-Content -Path 'release-assets/SHA256SUMS.txt' -Encoding utf8

          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:GITHUB_SHA
            sourceRef = $env:GITHUB_REF
            platform = 'windows'
            architecture = 'x86_64'
            packageType = 'nsis'
            version = $version
            signed = $false
            updaterArtifact = $false
            sha256 = $sha256
          } | ConvertTo-Json | Set-Content -Path 'release-assets/windows-build-receipt.json' -Encoding utf8

      - name: Upload internal artifact only
        uses: actions/upload-artifact@v4
        with:
          name: yeschoy-windows-x64-internal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
