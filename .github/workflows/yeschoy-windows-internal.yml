name: Yeschoy Windows Internal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeschoy-windows-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 internal installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out selected source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack install
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify renderer
        run: >-
          pnpm exec vitest run
          src/candidate/readiness.test.ts
          src/diagnostics/contract.test.ts
          src/configuration/preview.test.ts
          src/service-catalog/contract.test.ts
          src/service-catalog/access-plan.test.ts
          src/service-catalog/ServiceCatalogPanel.test.tsx
          src/service-catalog/handoff.test.ts
          src/billing/comparison.test.ts
          src/billing/CostComparison.test.tsx
          src/workbench/Workbench.test.tsx
          src/workbench/Repair.test.tsx
          --exclude "release/**"
          --exclude "work/**"

      - name: Verify native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned internal NSIS installer
        run: pnpm exec tauri build --config src-tauri/tauri.candidate.conf.json --bundles nsis -- --locked

      - name: Prepare exact internal artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No NSIS installer was produced.'
          }

          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          $destination = 'release-assets/野菜API-0.1.0-20260901-Windows-x64-内测版.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          "$sha256  野菜API-0.1.0-20260901-Windows-x64-内测版.exe" |
            Set-Content -Path 'release-assets/SHA256SUMS.txt' -Encoding utf8

          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:GITHUB_SHA
            sourceRef = $env:GITHUB_REF
            platform = 'windows'
            architecture = 'x86_64'
            packageType = 'nsis'
            signed = $false
            updaterArtifact = $false
            sha256 = $sha256
          } | ConvertTo-Json | Set-Content -Path 'release-assets/windows-build-receipt.json' -Encoding utf8

      - name: Upload internal artifact only
        uses: actions/upload-artifact@v4
        with:
          name: yeschoy-windows-x64-internal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
