name: Yeschoy Windows Internal

on:
  workflow_dispatch:
    inputs:
      authorization_origin:
        description: "Authorization page origin (yeschoy.com = 主版本, ai.yeschoy.io = 朋友版)"
        required: true
        default: yeschoy.com
        type: choice
        options:
          - yeschoy.com
          - ai.yeschoy.io

permissions:
  contents: read

concurrency:
  group: yeschoy-windows-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 internal installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"

      - name: Cache native build dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-yeschoy-internal-v2-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack install
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify renderer types
        run: pnpm typecheck

      - name: Verify renderer
        run: pnpm test:unit

      # `generate_context!()` 在编译期就要 `frontendDist`（`../dist`）真实存在，
      # 所以渲染层必须先产出一次 —— 否则下一步的 `cargo test` 会以
      # “proc macro panicked … this path doesn't exist” 失败。本机看不出来，
      # 因为工作树里早就留着上一次构建的 dist；干净检出才会暴露。
      - name: Build renderer so the native context can be generated
        run: pnpm run build:renderer

      - name: Verify native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build internal NSIS installer and signed updater payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          YESCHOY_AUTHORIZATION_PAGE_ORIGIN: https://${{ inputs.authorization_origin }}
        # 用 CI 专用配置：不让 Tauri 造更新器构件。它只认 tauri.conf.json 里
        # 那一个 `pubkey`（本仓库故意留空），而自动更新实际走
        # `update-channels.json` 里按通道分开的两把公钥 —— 一个仓库密钥服务不了
        # 两个通道。安装包的更新签名改由本机 `local-signing.mjs` 按 variant 补。
        run: pnpm exec tauri build --config src-tauri/tauri.ci-windows.conf.json --bundles nsis

      - name: Smoke test upgrade while old and background copies are running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No NSIS installer was produced for the running-upgrade smoke test.'
          }
          & './scripts/ci/smoke-windows-running-upgrade.ps1' -InstallerPath $installer.FullName

      - name: Prepare exact internal artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No NSIS installer was produced.'
          }
          # 更新器构件是可选的，理由见上面的构建步骤。安装包才是这个作业的产出。
          $updater = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.nsis.zip' -File |
            Select-Object -First 1
          $updaterSignature = if ($null -ne $updater) { "$($updater.FullName).sig" } else { $null }
          $hasUpdater = ($null -ne $updater) -and (Test-Path -LiteralPath $updaterSignature -PathType Leaf)

          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $variant = if ('${{ inputs.authorization_origin }}' -eq 'ai.yeschoy.io') { '-朋友版' } else { '' }
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          $fileName = "野菜API-$version-Windows-x64-内测版$variant.exe"
          $destination = "release-assets/$fileName"
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          $checksums = @("$sha256  $fileName")
          $updaterName = $null
          $updaterSha256 = $null
          if ($hasUpdater) {
            $updaterName = "yeschoy-$version-windows-x86_64.nsis.zip"
            $updaterDestination = "release-assets/$updaterName"
            Copy-Item -LiteralPath $updater.FullName -Destination $updaterDestination
            Copy-Item -LiteralPath $updaterSignature -Destination "$updaterDestination.sig"
            $updaterSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $updaterDestination).Hash.ToLowerInvariant()
            $checksums += "$updaterSha256  $updaterName"
          }
          ($checksums -join "`n") |
            Set-Content -Path 'release-assets/SHA256SUMS.txt' -Encoding utf8

          [ordered]@{
            schemaVersion = 2
            sourceCommit = $env:GITHUB_SHA
            sourceRef = $env:GITHUB_REF
            platform = 'windows'
            architecture = 'x86_64'
            packageType = 'nsis'
            version = $version
            authorizationOrigin = '${{ inputs.authorization_origin }}'
            codeSigned = $false
            updaterArtifact = $hasUpdater
            updaterSigned = $hasUpdater
            sha256 = $sha256
            updaterSha256 = $updaterSha256
            updaterFile = $updaterName
          } | ConvertTo-Json | Set-Content -Path 'release-assets/windows-build-receipt.json' -Encoding utf8

      - name: Upload internal artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yeschoy-windows-x64-internal-${{ inputs.authorization_origin }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
