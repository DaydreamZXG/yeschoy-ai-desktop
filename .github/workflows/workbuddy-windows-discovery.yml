name: WorkBuddy Windows discovery (e2e)

on:
  push:
    branches: [fix/dsh-windows-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsh-discovery:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download WorkBuddy installer
        shell: pwsh
        run: |
          $feed = Invoke-RestMethod "https://www.workbuddy.cn/v2/update?platform=workbuddy-win32-x64-user"
          $feed | Format-List *
          $url = $feed.url
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wb-setup.exe"
          Get-Item "$env:RUNNER_TEMP\wb-setup.exe" | Format-List Name,Length
          (Get-Item "$env:RUNNER_TEMP\wb-setup.exe").VersionInfo | Format-List *
          Get-AuthenticodeSignature "$env:RUNNER_TEMP\wb-setup.exe" | Format-List Status,StatusMessage,SignerCertificate

      - name: Install silently
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\wb-setup.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min($bytes.Length, 8MB))
          $type = "unknown"
          if ($text -match "Nullsoft") { $type = "nsis" }
          elseif ($text -match "Inno Setup") { $type = "inno" }
          elseif ($text -match "Squirrel") { $type = "squirrel" }
          Write-Host "Installer type guess: $type"
          $attempts = switch ($type) {
            "inno" { @(@("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER")) }
            "squirrel" { @(@("--silent")) }
            default { @(@("/S"), @("/S","/currentuser"), @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"), @("--silent")) }
          }
          foreach ($a in $attempts) {
            Write-Host "Trying: $($a -join ' ')"
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(600000)) { Write-Host "timeout"; $p.Kill(); continue }
            Write-Host "exit code $($p.ExitCode)"
            Start-Sleep 10
            $found = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "(?i)workbuddy|codebuddy|tencent" }
            if ($found) { break }
          }
          Get-Process | Where-Object { $_.Name -match "(?i)workbuddy|codebuddy|tencent" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Diagnostics
        shell: pwsh
        run: |
          Write-Host "=== Executables ==="
          $exes = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "(?i)workbuddy|codebuddy|tencent" }
          foreach ($e in $exes) {
            $v = $e.VersionInfo
            $sig = Get-AuthenticodeSignature $e.FullName
            Write-Host "PATH: $($e.FullName)"
            Write-Host "  ProductName=[$($v.ProductName)] CompanyName=[$($v.CompanyName)] FileDescription=[$($v.FileDescription)] OriginalFilename=[$($v.OriginalFilename)] ProductVersion=[$($v.ProductVersion)] FileVersion=[$($v.FileVersion)]"
            Write-Host "  Signature=$($sig.Status) Signer=$($sig.SignerCertificate.Subject)"
          }
          Write-Host "=== Uninstall entries ==="
          foreach ($k in "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*") {
            Get-ItemProperty $k -ErrorAction SilentlyContinue | Where-Object { "$($_.DisplayName)$($_.Publisher)$($_.PSChildName)" -match "(?i)workbuddy|codebuddy|tencent" } | Format-List PSPath,DisplayName,DisplayVersion,Publisher,InstallLocation,DisplayIcon,UninstallString
          }
          Write-Host "=== App Paths ==="
          foreach ($k in "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\*","HKLM:\Software\Microsoft\Windows\CurrentVersion\App Paths\*") {
            Get-ItemProperty $k -ErrorAction SilentlyContinue | Where-Object { "$($_.PSChildName)$($_.'(default)')" -match "(?i)workbuddy|codebuddy|tencent" } | Format-List *
          }
          Write-Host "=== Protocol handlers ==="
          Get-ChildItem "HKCU:\Software\Classes" -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match "(?i)workbuddy|codebuddy|tencent" } | ForEach-Object { $_.PSPath }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Run real discovery
        shell: pwsh
        working-directory: src-tauri
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          cargo test --lib e2e_windows_workbuddy_is_discovered -- --ignored --nocapture
