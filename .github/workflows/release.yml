name: Yeschoy Signed Update Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to build, without v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yeschoy-update-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Source and version gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate every GitHub Actions workflow
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
          components: clippy,rustfmt
      - name: Enable locked pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install
      - name: Require one exact version identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const packageVersion = JSON.parse(fs.readFileSync('package.json')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version = "([^"]+)"/m)?.[1];
          const requested = process.env.REQUESTED_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(requested || '')) throw new Error('version must be stable semver');
          if (![packageVersion, tauriVersion, cargoVersion].every((value) => value === requested)) {
            throw new Error(`version mismatch: request=${requested} package=${packageVersion} tauri=${tauriVersion} cargo=${cargoVersion}`);
          }
          NODE
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject high-severity production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Reject RustSec dependency vulnerabilities
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/cargo-audit"
          advisory_db="$RUNNER_TEMP/rustsec-advisory-db"
          cargo install cargo-audit --version 0.22.2 --locked --root "$audit_root"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$advisory_db"
          "$audit_root/bin/cargo-audit" audit --no-fetch --db "$advisory_db" --file src-tauri/Cargo.lock
      - name: Verify renderer
        run: |
          pnpm typecheck
          pnpm test:unit
          pnpm build:renderer
      - name: Verify native core
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-x64:
    name: Windows x64 updater payload
    needs: source-gate
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
      - name: Enable locked pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require updater signing secret
        shell: pwsh
        env:
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $required = @('UPDATE_KEY', 'UPDATE_PASSWORD', 'WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD', 'WINDOWS_TIMESTAMP_URL')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Required release credential $name is not configured."
            }
          }
      - name: Import Windows publisher certificate and create release config
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'yeschoy-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey -or $certificate.NotAfter -le (Get-Date)) {
            throw 'Windows publisher certificate is missing a private key or is expired.'
          }
          $configPath = Join-Path (Resolve-Path 'src-tauri').Path 'tauri.windows-release.runtime.json'
          $config = @{
            '$schema' = 'https://schema.tauri.app/config/2'
            bundle = @{
              active = $true
              createUpdaterArtifacts = $true
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                nsis = @{
                  languages = @('SimpChinese')
                  displayLanguageSelector = $false
                  installerHooks = 'windows/installer-hooks.nsh'
                }
                wix = @{ language = 'zh-CN' }
              }
            }
          }
          [IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          "YESCHOY_WINDOWS_RELEASE_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "YESCHOY_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer and signed updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config "$env:YESCHOY_WINDOWS_RELEASE_CONFIG" --bundles nsis
      - name: Smoke test upgrade while old and background copies are running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No NSIS installer was produced for the running-upgrade smoke test.'
          }
          & './scripts/ci/smoke-windows-running-upgrade.ps1' -InstallerPath $installer.FullName
      - name: Collect immutable candidate files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $root -Filter '*.exe' -File | Select-Object -First 1
          $updater = Get-ChildItem $root -Filter '*.nsis.zip' -File | Select-Object -First 1
          if ($null -eq $installer -or $null -eq $updater -or -not (Test-Path "$($updater.FullName).sig")) {
            throw 'Complete Windows installer/updater/signature set was not produced.'
          }
          $authenticode = Get-AuthenticodeSignature $installer.FullName
          if ($authenticode.Status -ne 'Valid' -or $null -eq $authenticode.SignerCertificate -or $authenticode.SignerCertificate.Thumbprint -ne $env:YESCHOY_WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw "Windows installer Authenticode verification failed: $($authenticode.Status)"
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer.FullName "release-assets/yeschoy-$env:RELEASE_VERSION-windows-x86_64-installer.exe"
          Copy-Item $updater.FullName "release-assets/yeschoy-$env:RELEASE_VERSION-windows-x86_64.nsis.zip"
          Copy-Item "$($updater.FullName).sig" "release-assets/yeschoy-$env:RELEASE_VERSION-windows-x86_64.nsis.zip.sig"
          $hashes = Get-ChildItem release-assets -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllLines('release-assets/SHA256SUMS-windows.txt', $hashes, [Text.UTF8Encoding]::new($false))
      - name: Upload private Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yeschoy-${{ inputs.version }}-windows-x86_64-update-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  macos-universal:
    name: Notarized universal macOS updater payload
    needs: source-gate
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Enable locked pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate="$RUNNER_TEMP/yeschoy-release.p12"
          keychain="$RUNNER_TEMP/yeschoy-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Build signed notarized app and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          pnpm exec tauri build --config src-tauri/tauri.candidate.conf.json --target universal-apple-darwin --bundles app,dmg
      - name: Collect immutable candidate files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root='src-tauri/target/universal-apple-darwin/release/bundle/macos'
          dmg_root='src-tauri/target/universal-apple-darwin/release/bundle/dmg'
          app="$(find "$root" -maxdepth 1 -type d -name '*.app' -print -quit)"
          updater="$(find "$root" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          installer="$(find "$dmg_root" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$updater"
          test -n "$installer"
          test -f "$updater.sig"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$installer"
          mkdir -p release-assets
          cp "$installer" "release-assets/yeschoy-$RELEASE_VERSION-macos-universal-installer.dmg"
          cp "$updater" "release-assets/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz"
          cp "$updater.sig" "release-assets/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz.sig"
          (
            cd release-assets
            shasum -a 256 \
              "yeschoy-$RELEASE_VERSION-macos-universal-installer.dmg" \
              "yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz" \
              "yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz.sig" \
              > SHA256SUMS-macos.txt
          )
      - name: Upload private macOS candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yeschoy-${{ inputs.version }}-macos-universal-update-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
