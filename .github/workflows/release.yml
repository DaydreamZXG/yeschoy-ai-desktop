name: Yeschoy Signed Update Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to build, without v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yeschoy-update-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Source and version gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
      - name: Enable locked pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install
      - name: Require one exact version identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const packageVersion = JSON.parse(fs.readFileSync('package.json')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version = "([^"]+)"/m)?.[1];
          const requested = process.env.REQUESTED_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(requested || '')) throw new Error('version must be stable semver');
          if (![packageVersion, tauriVersion, cargoVersion].every((value) => value === requested)) {
            throw new Error(`version mismatch: request=${requested} package=${packageVersion} tauri=${tauriVersion} cargo=${cargoVersion}`);
          }
          NODE
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify renderer
        run: |
          pnpm typecheck
          pnpm test:unit
          pnpm build:renderer
      - name: Verify native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-x64:
    name: Windows x64 updater payload
    needs: source-gate
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
      - name: Enable locked pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require updater signing secret
        shell: pwsh
        env:
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_KEY) -or [string]::IsNullOrWhiteSpace($env:UPDATE_PASSWORD)) {
            throw 'Tauri updater signing secrets are not configured.'
          }
      - name: Build installer and signed updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config src-tauri/tauri.candidate.conf.json --bundles nsis
      - name: Collect immutable candidate files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $root -Filter '*.exe' -File | Select-Object -First 1
          $updater = Get-ChildItem $root -Filter '*.nsis.zip' -File | Select-Object -First 1
          if ($null -eq $installer -or $null -eq $updater -or -not (Test-Path "$($updater.FullName).sig")) {
            throw 'Complete Windows installer/updater/signature set was not produced.'
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer.FullName "release-assets/yeschoy-$env:RELEASE_VERSION-windows-x86_64-installer.exe"
          Copy-Item $updater.FullName "release-assets/yeschoy-$env:RELEASE_VERSION-windows-x86_64.nsis.zip"
          Copy-Item "$($updater.FullName).sig" "release-assets/yeschoy-$env:RELEASE_VERSION-windows-x86_64.nsis.zip.sig"
          Get-ChildItem release-assets -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS-windows.txt -Encoding utf8
      - name: Upload private Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: yeschoy-${{ inputs.version }}-windows-x86_64-update-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  macos-universal:
    name: Notarized universal macOS updater payload
    needs: source-gate
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Enable locked pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate="$RUNNER_TEMP/yeschoy-release.p12"
          keychain="$RUNNER_TEMP/yeschoy-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Build signed notarized app and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          pnpm exec tauri build --config src-tauri/tauri.candidate.conf.json --target universal-apple-darwin --bundles app
      - name: Collect immutable candidate files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root='src-tauri/target/universal-apple-darwin/release/bundle/macos'
          updater="$(find "$root" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater"
          test -f "$updater.sig"
          mkdir -p release-assets
          cp "$updater" "release-assets/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz"
          cp "$updater.sig" "release-assets/yeschoy-$RELEASE_VERSION-macos-universal.app.tar.gz.sig"
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS-macos.txt
      - name: Upload private macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: yeschoy-${{ inputs.version }}-macos-universal-update-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
