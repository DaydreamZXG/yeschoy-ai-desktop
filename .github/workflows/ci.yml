name: YesChoy CI

on:
  push:
    branches: [main, "product/**"]
  pull_request:
    branches: [main, "product/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: yeschoy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Current desktop renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Setup pinned pnpm from packageManager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 (Node 24 action runtime)

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check workflow formatting
        run: pnpm exec prettier --check .github/workflows/ci.yml .github/workflows/wsl2-nightly.yml

      - name: All current renderer behavior tests
        run: pnpm test:unit

      - name: Build real renderer
        run: pnpm build:renderer

      # Historical release-unit proofs remain archived in governance. They
      # assert obsolete navigation/build versions and are not current CI tests.
      # Current login, recovery, pricing and activation behavior is tested above.

  native:
    name: Native tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: Windows x64
          - os: macos-15-intel
            platform: macOS Intel
          - os: macos-15
            platform: macOS Apple Silicon
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Rust matching rust-toolchain.toml
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache native Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-yeschoy-ci-v1-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Setup pinned pnpm from packageManager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 (Node 24 action runtime)

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build real renderer
        run: pnpm build:renderer

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check current Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy current native targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Use the runner's native temporary directories. Never invoke Cargo with
      # TEMP/TMP redirected to a WSL UNC path (the original LNK1327 failure).
      - name: Run nonempty current native test suite
        run: python scripts/ci/run-rust-tests.py

      - name: Compile application binary (not an installer)
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin yeschoy-desktop
