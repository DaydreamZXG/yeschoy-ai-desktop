[package]
name = "yeschoy-desktop"
version = "0.5.4"
description = "YesChoy: connect your AI apps to any relay station, no command line"
authors = ["YesChoy contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.89.0"
autotests = false

[lib]
name = "yeschoy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
# vendored 的 proxy/providers/streaming.rs 用 async_stream::stream!。
# 0.3.6 在本地 registry 缓存里，加它只改 lock、不产生下载。
async-stream = "0.3"
aes-gcm = "0.10.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
# 只用来找系统分给应用的数据目录；6.0.0 本来就在 lock 里（tauri 依赖它）。
dirs = "6"
# 同 thiserror：vendored 的 proxy/ 需要，1.11.1 本来就在 lock 与本地缓存里。
bytes = "1.5"
caseless = "=0.2.2"
futures = "0.3"
getrandom = "0.3"
http = "1"
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy", "client-proxy-system"] }
json5 = "0.4"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
log = "0.4"
quick-xml = "0.42"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "native-tls", "socks", "stream"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
# vendored 的 proxy/ 用它派生错误类型；2.0.18 本来就在 lock 与本地缓存里，
# 加成直接依赖不产生新下载，`--offline` 出包不受影响。
thiserror = "2.0"
tauri = { version = "2.8.2", default-features = false, features = ["wry", "tray-icon"] }
tauri-plugin-updater = { version = "=2.9.0", default-features = false, features = ["native-tls", "zip"] }
# 应用更新用的 reqwest 0.12：打开 socks，系统代理是 SOCKS5 时也能查更新、下载更新。
reqwest_updater = { package = "reqwest", version = "=0.12.28", default-features = false, features = ["socks"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false }
toml_edit = { version = "0.24", features = ["serde"] }
unicode-normalization = "=0.1.25"
# vendored 的 proxy/usage/parser.rs 需要；1.22.0 已在 lock 与本地缓存里。
uuid = { version = "1.11", features = ["v4"] }
# 命令行工具的官方包有 tar.gz；两者本来就在 lock 与本地缓存里（更新插件在用）。
flate2 = "1"
tar = "0.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-deep-link = "=2.4.10"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_Storage_Packaging_Appx", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.4.0", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 和 wry 用的是同一份；只为了接「渲染进程没了」这个信号。
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
system-configuration = "=0.7.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
