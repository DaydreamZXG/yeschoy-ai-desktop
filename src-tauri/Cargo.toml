[package]
name = "yeschoy-desktop"
version = "0.1.0"
description = "Official beginner-friendly desktop assistant for 野菜API"
authors = ["YesChoy"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"
autotests = false

[lib]
name = "yeschoy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.2", default-features = false, features = ["wry"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
