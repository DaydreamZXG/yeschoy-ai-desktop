[package]
name = "yeschoy-desktop"
version = "0.4.15"
description = "Official beginner-friendly desktop assistant for 野菜API"
authors = ["YesChoy"]
license = "MIT"
edition = "2021"
rust-version = "1.89.0"
autotests = false

[lib]
name = "yeschoy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
aes-gcm = "0.10.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
caseless = "=0.2.2"
futures = "0.3"
getrandom = "0.3"
json5 = "0.4"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
log = "0.4"
quick-xml = "0.42"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "native-tls", "stream"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.8.2", default-features = false, features = ["wry"] }
tauri-plugin-updater = { version = "=2.9.0", default-features = false, features = ["native-tls", "zip"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml_edit = { version = "0.24", features = ["serde"] }
thiserror = "2"
unicode-normalization = "=0.1.25"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_Storage_Packaging_Appx", "Win32_Security_Cryptography", "Win32_Security_WinTrust"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
