[package]
name = "yeschoy-desktop"
version = "0.3.0"
description = "Official beginner-friendly desktop assistant for 野菜API"
authors = ["YesChoy"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"
autotests = false

[lib]
name = "yeschoy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", default-features = false, features = ["wry"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
