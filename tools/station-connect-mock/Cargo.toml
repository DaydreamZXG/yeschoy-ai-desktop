[package]
name = "station-connect-mock"
version = "0.1.0"
edition = "2021"
description = "Local mock station for desktop connect-code issue + exchange (E2E dev only)"
publish = false

[[bin]]
name = "station-connect-mock"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-extra = { version = "0.10", default-features = false, features = ["cookie"] }
cookie = "0.18"
url = "2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
