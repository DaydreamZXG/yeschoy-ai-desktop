<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>连接桌面助手</title>
  <link rel="stylesheet" href="/site/theme.css" />
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-float);
      padding: 28px 24px 22px;
    }
    .brand-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .lede {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    button[data-yeschoy-connect] {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button[data-yeschoy-connect]:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button[data-yeschoy-connect]:active:not(:disabled) {
      transform: scale(0.99);
    }
    button[data-yeschoy-connect]:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    #status {
      min-height: 1.25rem;
      margin: 14px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }
    #status.is-error { color: var(--danger); }
    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
    }
    footer a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 550;
    }
  </style>
  <script src="/connect.js" defer data-download-url="/download/"></script>
</head>
<body>
  <main>
    <div class="brand-row">
      <span class="mark" aria-hidden="true">野</span>
      <span style="font-weight:650;font-size:14px;">野菜桌面助手</span>
    </div>
    <h1 id="title">连接桌面助手</h1>
    <p class="lede" id="lede">
      若尚未登录，请先在本站完成登录，再点击下方按钮。浏览器会拉起野菜桌面端，无需复制 API 密钥。
    </p>
    <button type="button" data-yeschoy-connect id="connect-btn">
      打开桌面助手
    </button>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>
      <span id="footer-no-app">还没有桌面端？</span>
      <a id="footer-download" href="/download/">下载安装</a>
      ·
      <a href="/">首页</a>
    </footer>
  </main>
  <script>
    (function () {
      var zh =
        document.documentElement.lang.startsWith("zh") ||
        (navigator.language && navigator.language.startsWith("zh"));
      if (!zh) {
        document.documentElement.lang = "en";
        document.getElementById("title").textContent = "Connect desktop assistant";
        document.getElementById("lede").textContent =
          "Sign in on this site if you have not already, then use the button below. Your browser will open the YesChoy desktop app — no API keys to copy.";
        document.getElementById("connect-btn").textContent = "Open YesChoy desktop";
        document.getElementById("footer-no-app").textContent = "No desktop app?";
        document.getElementById("footer-download").textContent = "Download";
        document.title = "Connect desktop assistant";
      }

      var btn = document.getElementById("connect-btn");
      var status = document.getElementById("status");

      function setStatus(text, isError) {
        status.textContent = text || "";
        status.className = isError ? "is-error" : "";
      }

      var messages = zh
        ? {
            issuing: "正在申请连接…",
            opening: "正在打开桌面助手…",
            session_required: "请先登录本站，再重试。",
            connect_origin_not_https: "此页面须通过 HTTPS 访问。",
            issue_failed: "暂时无法连接，请稍后重试。",
            generic: "连接未完成，请重试。",
          }
        : {
            issuing: "Requesting connection…",
            opening: "Opening the desktop app…",
            session_required: "Sign in on this site first, then try again.",
            connect_origin_not_https: "This page must be served over HTTPS.",
            issue_failed: "Could not connect right now. Try again shortly.",
            generic: "Connection did not finish. Try again.",
          };

      var autoLaunch =
        new URLSearchParams(window.location.search).get("auto") === "1";

      if (autoLaunch) {
        document.getElementById("lede").textContent = zh
          ? "已登录？正在自动连接桌面助手…"
          : "Signed in? Connecting to the desktop app automatically…";
      }

      btn.addEventListener("click", function () {
        setStatus(messages.issuing, false);
        btn.disabled = true;
      });

      document.addEventListener("yeschoy-connect-auto-start", function () {
        setStatus(messages.issuing, false);
      });

      function uiReasonCode(code) {
        if (!code) return "issue_failed";
        var upper = String(code).toUpperCase();
        if (upper === "AUTH_UNAUTHORIZED" || upper === "SESSION_REQUIRED") {
          return "session_required";
        }
        return String(code);
      }

      btn.addEventListener("yeschoy-connect-error", function (event) {
        btn.disabled = false;
        var err = event.detail;
        var code =
          err && err.reasonCode ? String(err.reasonCode) : "issue_failed";
        var text = messages[uiReasonCode(code)] || messages.generic;
        setStatus(text, true);
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          setStatus(messages.opening, false);
        }
      });
    })();
  </script>
</body>
</html>
