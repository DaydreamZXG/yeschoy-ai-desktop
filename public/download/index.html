<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>下载野菜桌面助手</title>
  <link rel="stylesheet" href="/site/theme.css" />
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-float);
      padding: 28px 24px 22px;
    }
    .brand-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .lede {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }
    [data-download-actions] {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    [data-download-note],
    [data-download-status] {
      margin: 0 0 12px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }
    footer a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 550;
    }
    footer a:hover { text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <main data-yeschoy-download>
    <div class="brand-row">
      <span class="mark" aria-hidden="true">野</span>
      <span style="font-weight:650;font-size:14px;">野菜桌面助手</span>
    </div>
    <h1>下载野菜桌面助手</h1>
    <p class="lede">
      支持 macOS 与 Windows。我们会根据你的电脑推荐一个主按钮；也可以手动选择另一系统。
    </p>
    <p data-download-status aria-live="polite"></p>
    <p data-download-note></p>
    <div data-download-actions></div>
    <footer>
      <a data-download-releases href="https://github.com/DaydreamZXG/yeschoy-ai-desktop/releases">
        在 GitHub 查看全部版本
      </a>
      <a href="/">返回首页</a>
      <a href="/desktop/connect">一键连接</a>
    </footer>
  </main>
  <script src="/download.js" defer></script>
</body>
</html>
